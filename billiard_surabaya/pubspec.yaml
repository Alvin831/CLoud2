name: billiard_surabaya
description: Aplikasi pencarian tempat billiard di Surabaya
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_fonts: ^6.1.0
  provider: ^6.1.1
  carousel_slider: ^5.0.0
  smooth_page_indicator: ^1.1.0
  firebase_core: ^3.1.1
  cloud_firestore: ^5.0.1
  firebase_auth: ^5.1.0
  google_sign_in: ^6.2.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  http: ^1.2.1
  intl: ^0.20.2
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/images/apollo.jpeg
    - assets/images/blackhome.jpeg
    - assets/images/Gotham.jpeg
    - assets/images/home.jpeg
    - assets/images/Nio.jpeg
    - assets/images/Sniper.jpeg
    - assets/images/Strike.jpeg
    - assets/images/Zuper.jpeg
    - assets/images/Zuper1.jpeg
    - assets/images/probet.jpg
    - assets/images/osaka.jpg
    - assets/images/andika.jpg
    - assets/images/jjpool.jpg
    - assets/images/sonic.jpg
    - assets/images/phantom.jpg